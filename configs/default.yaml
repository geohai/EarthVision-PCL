project:
  name: loc4pm
  seed: 42
  exp_dir: experiments
  log_dir: experiments/logs
  ckpt_dir: experiments/ckpt
  results_dir: experiments/results

data:
#  root: /ocean/projects/cis250170p/zwang63/data/loc4pm/processed/EO_NCAR_merged_maxslope
#  ncar_grid_path: /ocean/projects/cis250170p/zwang63/data/loc4pm/processed/ncar_grid_parquet/
  root: /home/zhongying/Documents/loc4pm/dataset/EO_NCAR_merged/ # Local Root
  ncar_grid_path: /home/zhongying/Documents/loc4pm/dataset/ncar_grid_parquet/
  start_date: 2017-02-01
  end_date:   2018-12-31
  x_prefix: TS_X_
  y_prefix: TS_y_
  # Drop lat/lon, PM25_TOT and all auxiliary physical features from the time-series input
  drop_feature_indices: [5,6,20,21,22,23,24,25,26,27,28]
  filter_y_positive: true
  remove_nan_rows: true
  # Apply z‑score normalisation to the observation target ``y`` (PM2.5).  When
  # ``scaler_type`` is set to ``zscore``, the ``y_stats`` dictionary must
  # provide the mean and standard deviation of the target variable.
  scaler_type: zscore # minmax | robust | zscore
  scaler_range: [-1.0, 1.0]
  y_stats:
    mean: 8.123598
    std: 6.9578805
  save_scalers_to: experiments/ckpt/scalers
  num_workers: 16
  prefetch_files: 4
  # indices (in *raw* feature order) for lat/lon — used only to build spatial folds
  lat_feature_index: 5
  lon_feature_index: 6
  # Primary physical variable indices (PM25_TOT)
#  z_feature_indices: []
  z_feature_indices: [20]
  #Auxiliary physical variable indices
#  z_aux_feature_indices: []
  z_aux_feature_indices: [21,22,23,24,25,26,27,28]
  # Names for primary and auxiliary physical variables (order match the indices)
#  z_feature_names: []
  z_feature_names: [PM25_TOT]
#  z_aux_feature_names: []
  z_aux_feature_names: [AIR_DENS, RH, SFC_TMP, PBLH, SOL_RAD, precip, U10, V10]
  # Optional precomputed statistics (mean and std) for physical variables
  z_stats:
    AIR_DENS:
      mean: 1.1512845957297775
      std: 0.08888364063086823
    PBLH:
      mean: 605.8271972094384
      std: 338.78291271830165
    PM25_TOT:
      mean: 4.440442239536324
      std: 3.79584124370734
    RH:
      mean: 68.3753412894767
      std: 18.04489014810413
    SFC_TMP:
      mean: 14.212154380636798
      std: 11.343138222099387
    SOL_RAD:
      mean: 205.41957931614638
      std: 102.58457802317618
    U10:
      mean: 0.5181524444398301
      std: 3.1456003332491203
    V10:
      mean: -0.06640392082439786
      std: 3.300957652585894
    precip:
      mean: 0.2514505105550966
      std: 0.7336837471794191

model:
  type: bilstm_attn
  hidden_size: 256
  num_layers: 3
  bidirectional: true
  dropout: 0.2
  attention: { type: luong, attn_dim: 256 }
  layer_norm: true
  head_dropout: 0.2

  # Optional location encoder configuration. If ``name`` is set to ``none`` or
  # omitted, the model behaves like the baseline BiLSTM regressor without
  # location fusion. Supported encoders include ``climplicit``, ``geoclip``, and
  # ``satclip``. The ``variant`` is applicable to Climplicit (``monthly`` or
  # ``annual``). ``emb_dim`` should match the embedding dimensionality of the
  # chosen encoder (e.g. 256 for monthly or 1024 for annual Climplicit). If
  # ``proj_dim`` is provided and differs from ``emb_dim``, the location
  # embeddings will be projected to this dimensionality prior to fusion.
  location:
    name: geoclip-time            # climplicit | geoclip | satclip | siren | resiren |none
    variant: doy-had      # monthly | annual (only for climplicit)
    emb_dim: 512          # raw embedding dimension of the location encoder
    pretrained: false       # whether to load pretrained weights if available
    freeze: false           # whether to freeze the location encoder during training
    proj_dim: null         # optional projection dimension; null for no projection
    fusion: concat        # concat | hadamard
    head_hidden_dim: 512   # hidden dimension for the fusion regression head
  physical_head_hidden_dim: 256
  aux_physical_head_hidden_dim: 256

# NEW: explicit split section
split:
  name: spatial             # random | spatial | checkerboard-deg
  seed: 42                 # ensures reproducible splits
  test_split: 0.50         # fraction for *test* holdout (kept fixed across runs)
  val_split: 0.05          # fraction for *validation* (from remaining train pool)
  spatial:
    n_splits: 2           # used when name=spatial
    fold_index: 0          # which fold is test (0..n_splits-1)
  checkerboard:
    scale: conus           # conus or global
    deg: 8.0               # cell size in degrees
    n_splits: 2            # number of folds in the checkerboard
    fold_index: 0          # which fold is used as test (0..n_splits-1)
    visualize: true        # optinal: for grid visualization downstream
    # Latitude and longitude offsets (in degrees) to shift the checkerboard
    # northward/southward and eastward/westward, respectively.  Positive
    # values move the grid up and right; negative values move it down or
    # left.  Set to zero for the default alignment.
    lat_offset: 0.0
    lon_offset: 0.0

train:
  device: cuda
  mixed_precision: true
  epochs: 100
  batch_size: 256
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    lr: 3.0e-4
    weight_decay: 0.0
    # Top‑level module weight decay overrides.  These keys should match the
    # names of modules in the model (e.g. ``lstm``, ``attn``, ``head``,
    # ``physical_head``, ``loc_encoder``).  Values override the global
    # weight decay for corresponding parameters.
    branch_weight_decay:
      lstm: 0.0
      attn: 1.0e-5
      head: 1.0e-5
      physical_head: 1.0e-5
      aux_physical_head: 1.0e-5
      loc_encoder: 0.0
  scheduler:
    name: reduce_on_plateau # exponential | reduce_on_plateau
#    gamma: 0.96
    mode: min
    factor: 0.5
    patience: 5
    threshold: 1.0e-6
    threshold_mode: rel      # or 'rel' if you prefer relative tolerance
    cooldown: 2
    min_lr: 1.0e-6
  early_stopping: { patience: 15 }
  # Base weights for the physical losses.  ``loss_weight_physical``
  # controls the contribution of the primary physical head (PM25_TOT), while
  # ``loss_weight_physical_aux`` controls the auxiliary physical head
  # contribution.  Adjust these weights to balance the relative importance
  # of supervised PM2.5 prediction versus physical simulation targets.
  loss_weight_physical: 0.2
  loss_weight_physical_aux: 0.4
  # Ratio of random NCAR samples drawn per batch relative to batch size.  A
  # value of 0 disables augmentation; 0.5 would draw roughly half as many
  # random samples as supervised samples.
  ncar_random_ratio: 16.0
  # -------- Location encoder pretraining (two-stage) --------
  # First N epochs: train only location encoder + physical heads.
  # After that: freeze location encoder and train EO encoder (LSTM branch).
  loc_pretrain_epochs: 0
  # Scale on observation (PM2.5) loss during pretraining.
  # 0.0 = physical-only pretraining (recommended for climplicit-style comparison)
  pretrain_pred_weight: 0.0

  # Physical loss weights during pretraining (defaults to loss_weight_physical/_aux if you remove them)
  pretrain_loss_weight_physical: 0.20
  pretrain_loss_weight_physical_aux: 0.40
  # Dynamic weighting for the physical loss.  When enabled, the loss weight for
  # the physical head is updated each epoch based on recent prediction and
  # physical losses using a Dynamic Weighted Average (DWA) mechanism.  ``temperature``
  # controls smoothness (higher values yield milder updates).  ``cap`` sets an
  # optional upper bound on the weight to prevent runaway growth; set to null
  # for no cap.
  loss_weight_physical_dynamic:
    enabled: false
    temperature: 3.0
    cap: 0.35

logging:
  tensorboard: true
  log_every_steps: 50
  run_name: ${project.name}_${data.start_date}_${data.end_date}_${split.name}
  save_epoch_csv: true
  epoch_csv: ${project.results_dir}/train_${data.start_date}_${data.end_date}_${split.name}.epochs.csv
  save_step_csv: false
  step_csv_every_n: 50
  step_csv: ${project.results_dir}/train_${data.start_date}_${data.end_date}_${split.name}.steps.csv


eval:
  save_val_predictions: true
  out_csv_val: ${project.results_dir}/val_${data.start_date}_${data.end_date}_${split.name}.csv
  out_csv_test: ${project.results_dir}/test_${data.start_date}_${data.end_date}_${split.name}.csv